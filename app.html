<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F2F1EA">
  <meta name="color-scheme" content="light">
  <meta name="application-name" content="CATODO">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CATODO">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>CATODO — World television</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/catodo-tv-32.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./icons/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="./icons/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="./assets/vendor/phosphor/style.css">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div id="boot-screen" role="status" aria-label="CATODO is starting">
    <div class="boot-fallback boot-bars--top" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="boot-fallback boot-bars--bottom" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="boot-lockup" aria-hidden="true">
      <strong>Catodo</strong>
      <span>VERSION 2.0.0</span>
    </div>
    <button id="boot-skip" type="button">Skip intro</button>
  </div>

  <main id="app" aria-live="polite"></main>
  <noscript>CATODO needs JavaScript to parse playlists and play live streams.</noscript>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
